# Publishes the three Magpie zips as a GitHub release once a day, if they
# changed since the last release, so the README's "latest release" download
# links give the newest files and GitHub counts the downloads. It sends
# nothing anywhere and adds no tracking to Magpie.
#
# It runs at 06:00 UTC. If the zips on main match the latest release, it
# does nothing. The tag is the Magpie version (the newest date in
# docs/CHANGELOG.md), for example v2026-10-31. If that tag already exists,
# the next one is v2026-10-31.2, then .3. Each release keeps its own
# download counts. To publish straight away, run it from Actions.
name: release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the zips if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zips="magpie.zip magpie-gemini.zip magpie-copilot.zip"
          # Compare with the latest release, if there is one.
          if gh release download --pattern '*.zip' --dir last >/dev/null 2>&1; then
            changed=no
            for z in $zips; do
              cmp -s "$z" "last/$z" || changed=yes
            done
            if [ "$changed" = no ]; then
              echo "The zips match the latest release; nothing to publish."
              exit 0
            fi
          fi
          version=$(grep -m1 -E '^## [0-9]{4}-[0-9]{2}-[0-9]{2}$' docs/CHANGELOG.md | cut -c4-)
          tag="v$version"
          title="Magpie $version"
          n=1
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="v$version.$n"
            title="Magpie $version (update $n)"
          done
          # Notes: that version's changelog entry.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' docs/CHANGELOG.md > notes.md
          gh release create "$tag" $zips \
            --title "$title" --notes-file notes.md --target "$GITHUB_SHA" --latest
