# Publishes the three Magpie zips as a GitHub release once a day, if they
# changed since the last release, so the README's "latest release" download
# links give the newest files and GitHub counts the downloads. It sends
# nothing anywhere and adds no tracking to Magpie.
#
# It runs at 06:00 UTC. If the zips on main match the latest release, it
# does nothing. The tag is the Magpie version (the newest date in
# docs/CHANGELOG.md), for example v2026-10-31. If that tag already exists,
# the next one is v2026-10-31.2, then .3. Each release keeps its own
# download counts. To publish straight away, run it from Actions.
#
# Each release also carries SHA256SUMS.txt, a SHA-256 fingerprint for
# each zip, so people can check a download is the real file.
#
# Release notes are public, so they come from docs/RELEASE-NOTES.md (short,
# plain words), not from the detailed changelog. Every run also brings the
# notes of past releases in line with that file, so a fix there reaches
# releases already published.
name: release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring past release notes in line with docs/RELEASE-NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'); do
            # v2026-10-31.2 uses the notes for 2026-10-31.
            version=$(printf '%s' "$tag" | sed -E 's/^v//; s/\.[0-9]+$//')
            awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on && (seen || NF) {seen=1; print}' docs/RELEASE-NOTES.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "No release notes for $version; leaving $tag as it is."
              continue
            fi
            if [ "$(gh release view "$tag" --json body --jq .body)" != "$(cat notes.md)" ]; then
              gh release edit "$tag" --notes-file notes.md
              echo "Updated the notes for $tag."
            fi
          done
      - name: Publish the zips if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zips="magpie.zip magpie-gemini.zip magpie-copilot.zip"
          # Compare with the latest release, if there is one.
          if gh release download --pattern '*.zip' --dir last >/dev/null 2>&1; then
            changed=no
            for z in $zips; do
              cmp -s "$z" "last/$z" || changed=yes
            done
            if [ "$changed" = no ]; then
              echo "The zips match the latest release; nothing to publish."
              exit 0
            fi
          fi
          version=$(grep -m1 -E '^## [0-9]{4}-[0-9]{2}-[0-9]{2}$' docs/CHANGELOG.md | cut -c4-)
          tag="v$version"
          title="Magpie $version"
          n=1
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="v$version.$n"
            title="Magpie $version (update $n)"
          done
          # Notes: that version's plain entry in docs/RELEASE-NOTES.md.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on && (seen || NF) {seen=1; print}' docs/RELEASE-NOTES.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Improvements to Magpie." > notes.md
          fi
          # Fingerprints, so people can check their download.
          sha256sum $zips > SHA256SUMS.txt
          gh release create "$tag" $zips SHA256SUMS.txt \
            --title "$title" --notes-file notes.md --target "$GITHUB_SHA" --latest
